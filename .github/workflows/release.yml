name: Build & Release Standalone Binary

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Frontend Static Export
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Export & Build Go Binary
        run: |
          cp -r frontend/out backend/out
          cd backend
          go build -ldflags="-s -w" -trimpath -o fcinside .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcinside
          path: backend/fcinside

      - name: Create GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/fcinside
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
