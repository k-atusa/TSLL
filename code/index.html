<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Community</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        body {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .hidden {
            display: none;
        }

        .post-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .post-card:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            .post-card {
                border-color: #444;
            }

            .post-card:hover {
                background-color: rgba(255, 255, 255, 0.05);
            }
        }

        .media-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .media-item {
            max-width: 100%;
            border-radius: 5px;
        }

        .download-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
        }

        .download-btn {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 10px;
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .download-btn:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>

<body>
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1 style="margin: 0;"><a href="#" id="homeLink" style="text-decoration: none; color: inherit;">Community</a></h1>
        <button id="newPostBtn" style="padding: 0 12px; font-size: 1.8em; border-radius: 5px; line-height: 1.2; background: transparent; border: 1px solid currentColor; color: inherit;">+</button>
    </header>
    <main>
        <!-- View: Post List -->
        <section id="viewList">
            <h2>Recent Posts</h2>
            <div id="postsContainer"></div>
        </section>

        <!-- View: New Post -->
        <section id="viewNewPost" class="hidden">
            <h2>Create a Post</h2>
            <form id="postForm">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>

                <label for="body">Body</label>
                <textarea id="body" name="body" rows="5"></textarea>

                <label for="files">Attachments</label>
                <input type="file" id="files" name="files" multiple>

                <div style="display: flex; gap: 10px;">
                    <button type="submit">Submit</button>
                    <button type="button" id="cancelPostBtn" style="background-color: transparent; border: 1px solid #ccc; color: inherit;">Cancel</button>
                </div>
            </form>
        </section>

        <!-- View: Post Detail -->
        <section id="viewPostDetail" class="hidden">
            <article id="detailContainer">
                <!-- Populated by JS -->
            </article>
            <div style="margin-top: 30px; border-top: 1px solid #ccc; padding-top: 15px;">
                <button id="backBtn" style="font-size: 1.5em; padding: 5px 20px; background: transparent; border: 1px solid #ccc; cursor: pointer;">&larr;</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
